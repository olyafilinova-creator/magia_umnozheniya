'use strict';
const A='Images/';const app=document.getElementById('app');const locations=['Холл','Спальня','Кухня','Гостиная'];const bg={Холл:'img6.png',Спальня:'img3.png',Кухня:'img4.png',Гостиная:'img5.png'};

const positions10=[[13,27],[35,22],[60,26],[85,23],[19,47],[77,48],[12,75],[35,78],[64,78],[88,76]];const positions6=[[19,29],[50,23],[81,30],[22,70],[51,75],[81,70]];

function el(s){return document.querySelector(s)}function fmt(t){let s=Math.floor(t/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function title(){screen(`<div class="content"><div class="panel namebox"><label for="player">Как зовут юного волшебника?</label><input id="player" maxlength="30" placeholder="Введи своё имя" autocomplete="off"><br>${btn('ОК ✨','begin()')}</div></div>`,'img1.mp4',true);el('#player').addEventListener('keydown',e=>{if(e.key==='Enter')begin()})}
function begin(){const name=el('#player').value.trim();if(!name){toast('Сначала введи имя!');return}state={name,started:Date.now(),errors:0,done:{},room:'',lives:5,items:[],current:null,ended:false};menu()}
function menu(){let all=locations.every(x=>state.done[x]);screen(`<div class="content"><h1 class="title" style="font-size:clamp(46px,7vw,95px)">Выбери локацию</h1><div class="subtitle">${esc(state.name)}, тебя ждут четыре испытания</div><div class="rooms">${locations.map(x=>`<button class="room" onclick="enter('${x}')">${x} ${state.done[x]?'<span class="check">✔</span>':''}<div class="small">${state.done[x]?'Пройдено':'Начать испытание'}</div></button>`).join('')}</div>${all?btn('Перейти к финалу ✨','finale()'):'<div class="subtitle">Пройди все четыре комнаты, чтобы открыть финал</div>'}</div>`,'img2.mp4',true)}
function makeItems(room){if(room==='Гостиная')return living.map(x=>({...x,solved:false,opened:false}));if(room==='Холл')return tasks.map(([text,answer])=>({text,answer,solved:false,opened:false}));let pairs=room==='Спальня'?[[2,3],[4,5],[6,7],[8,4],[9,3],[7,8],[5,6],[9,9],[3,7],[8,6]]:[[24,6],[45,5],[56,7],[72,8],[36,4],[63,9],[48,6],[81,9],[42,7],[54,6]];return pairs.map(([a,b])=>({text:room==='Спальня'?`${a} × ${b}`:`${a} : ${b}`,answer:room==='Спальня'?a*b:a/b,solved:false,opened:true}))}
function wrong(){state.errors++;state.lives--;hud();const pot=el('.cauldron');if(pot){pot.classList.remove('good');pot.classList.add('bad');setTimeout(()=>pot.classList.remove('bad'),850)}if(state.room==='Спальня')flash('bad');if(state.lives<=0){setTimeout(()=>fail(),550)}else toast('Неверно! Потеряна одна жизнь')}
function flash(type){let f=el('.flashlight');if(!f)return;f.classList.remove('bad','good');void f.offsetWidth;f.classList.add(type);clearTimeout(flashTimer);flashTimer=setTimeout(()=>f.classList.remove('bad','good'),700)}
function hud(){let h=el('.hearts');if(h)h.textContent='♥'.repeat(state.lives)+'♡'.repeat(5-state.lives);let p=el('#progress');if(p)p.textContent=`${state.items.filter(i=>i.solved).length} / ${state.items.length}`}
function enter(room){state.room=room;state.lives=5;state.items=makeItems(room);state.current=null;drawRoom()}
function drawRoom(){let room=state.room;screen(`<div class="roomstage ${room==='Спальня'?'bedroom':''}" id="stage"></div><div class="hud"><button class="goldbtn" onclick="menu()">← К комнатам</button><div class="panel roomtitle">${room} <span class="small" id="progress">0 / ${state.items.length}</span></div><div class="panel hearts">♥♥♥♥♥</div></div>${room==='Кухня'?'<div class="cauldron"><img class="cauldron-art" src="Images/img11.png" alt="Волшебный котёл"><div class="magic-water"><span class="bubble b1"></span><span class="bubble b2"></span><span class="bubble b3"></span><span class="bubble b4"></span><span class="bubble b5"></span><span class="bubble b6"></span></div></div>':''}${room==='Спальня'?'<div class="flashlight"></div>':''}`,bg[room],false,false);
const stage=el('#stage');state.items.forEach((item,i)=>{let pos=(room==='Холл'||room==='Гостиная'?positions6:positions10)[i];let n=document.createElement('div');n.style.left=pos[0]+'%';n.style.top=pos[1]+'%';n.dataset.i=i;if(['Спальня','Гостиная','Холл'].includes(room)&&i!==0)n.style.display='none';if(room==='Гостиная'){n.className='ghost floating';n.innerHTML=`<img src="${A}img9.png" alt="Привидение" style="width:100%;height:100%;object-fit:contain;mix-blend-mode:screen;border-radius:45%">`;n.addEventListener('click',()=>openGhost(i));}else if(room==='Холл'){n.className='firefly';n.style.backgroundImage=`url('${A}img10.png')`;n.title='Открыть задачу';n.addEventListener('click',()=>openTask(i));}else{n.className='parchment';n.style.setProperty('--r',`${(i%5-2)*3}deg`);n.innerHTML=paper(item,i)}stage.append(n)});
if(room==='Спальня'){let scene=el('.scene');const move=e=>{let r=scene.getBoundingClientRect();scene.style.setProperty('--mx',`${e.clientX-r.left}px`);scene.style.setProperty('--my',`${e.clientY-r.top}px`);stage.querySelectorAll('.parchment').forEach(card=>{const b=card.getBoundingClientRect();card.style.setProperty('--beam-x',`${e.clientX-b.left}px`);card.style.setProperty('--beam-y',`${e.clientY-b.top}px`);});};scene.addEventListener('pointermove',move);scene.addEventListener('pointerdown',move);scene.style.setProperty('--mx','50%');scene.style.setProperty('--my','50%');}
hud()}
function revealNext(i){
  if(!['Спальня','Гостиная','Холл'].includes(state.room))return;
  if(state.items.every(item=>item.solved))return;
  const room=state.room;
  setTimeout(()=>{
    if(state.room!==room||!el('#stage'))return;
    const next=state.items.findIndex(item=>!item.solved);
    const node=el(`[data-i="${next}"]`);
    if(node){node.style.display='';node.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.7)'},{opacity:1,transform:'translate(-50%,-50%) scale(1)'}],{duration:650,easing:'ease-out'});}
  },room==='Гостиная'?800:room==='Спальня'?700:450);
}
function distractor(answer,i){let d=([2,-3,4,-2,5,-4,3,-5,6,-6][i%10]);return Math.max(1,answer+d)===answer?answer+2:Math.max(1,answer+d)}
function paper(item,i){let a=item.answer,b=distractor(a,i),vals=i%2?[b,a]:[a,b];return `<div class="expr">${item.text}</div><div class="choices">${vals.map(v=>`<button onclick="choose(${i},${v})">${v}</button>`).join('')}</div>`}
function choose(i,value){if(state.lives<=0||state.items[i].solved)return;let item=state.items[i];if(value!==item.answer){wrong();return}item.solved=true;let n=el(`[data-i="${i}"]`);if(n){if(state.room==='Кухня'){n.style.transition='all .85s';n.style.left='50%';n.style.top='77%';n.style.opacity='0';n.style.scale='.15';let pot=el('.cauldron');pot.classList.add('good');setTimeout(()=>pot.classList.remove('good'),950)}else n.classList.add('solved')}if(state.room==='Спальня')flash('good');hud();checkComplete();revealNext(i)}
function openGhost(i){let item=state.items[i];if(item.opened||item.solved)return;item.opened=true;let n=el(`[data-i="${i}"]`);n.classList.add('melt');setTimeout(()=>{if(!el('#stage')||state.room!=='Гостиная')return;n.className='parchment';n.style.setProperty('--r','0deg');n.style.width='clamp(130px,15vw,205px)';n.innerHTML=paper(item,i)},1100)}
function openTask(i){let item=state.items[i];if(item.solved||state.lives<=0)return;state.current=i;let q=document.createElement('div');q.className='question';q.innerHTML=`<div style="font-size:25px;font-weight:bold">Задача ${i+1}</div><p>${esc(item.text)}</p><input id="numeric" type="number" inputmode="numeric" placeholder="Ответ"><div class="feedback" id="feedback"></div>${btn('Проверить','verify()')} <button class="goldbtn" onclick="closeTask()">Закрыть</button>`;el('.scene').append(q);el('#numeric').focus();el('#numeric').addEventListener('keydown',e=>{if(e.key==='Enter')verify()})}
function closeTask(){el('.question')?.remove();state.current=null}
function verify(){if(state.current===null)return;let inp=el('#numeric');if(!inp||inp.value.trim()==='')return;let i=state.current;if(Number(inp.value)===state.items[i].answer){state.items[i].solved=true;el(`[data-i="${i}"]`)?.remove();closeTask();hud();checkComplete();revealNext(i)}else{wrong();if(state.lives>0){el('#feedback').textContent='Попробуй ещё раз!';inp.select()}}}
function checkComplete(){if(!state.items.every(i=>i.solved))return;state.done[state.room]=true;let box=document.createElement('div');box.className='finish';box.innerHTML=`<div style="font-size:27px;color:#ffe4a3;margin-bottom:12px">✨ Испытание пройдено! ✨</div>${btn('Вернуться к выбору локаций','menu()')}`;el('.scene').append(box)}
function fail(){if(state.lives>0)return;el('.question')?.remove();let box=document.createElement('div');box.className='question';box.innerHTML=`<h2>Жизни закончились!</h2><p>Не сдавайся, волшебник! Попробуй пройти комнату ещё раз.</p>${btn('Повторить комнату','enter(state.room)')} ${btn('Выбор локаций','menu()')}`;el('.scene').append(box)}
function finale(){if(!locations.every(x=>state.done[x]))return;state.ended=true;let elapsed=Date.now()-state.started;let records=[];try{records=JSON.parse(localStorage.getItem('magic_scores_v1')||'[]');if(!Array.isArray(records))records=[]}catch(e){}records.push({name:state.name,time:elapsed,errors:state.errors,date:Date.now()});records.sort((a,b)=>a.time-b.time||a.errors-b.errors);try{localStorage.setItem('magic_scores_v1',JSON.stringify(records.slice(0,100)))}catch(e){}let sparks=Array.from({length:240},(_,i)=>{let a=i*2.399,r=55+(i%13)*19;return `<span class="spark" style="left:${4+(i*37%93)}%;top:${4+(i*29%88)}%;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px;--delay:${(i%17)*.12}s"></span>`}).join('');screen(`<div class="burst">${sparks}</div><div class="content"><div class="panel" style="margin:25px">Время: ${fmt(elapsed)} &nbsp; • &nbsp; Ошибок: ${state.errors}</div>${btn('Посмотреть результаты','results()')}</div>`,'img7.mp4',true)}
function results(){let records=[];try{records=JSON.parse(localStorage.getItem('magic_scores_v1')||'[]')}catch(e){}records.sort((a,b)=>a.time-b.time||a.errors-b.errors);screen(`<div class="content"><div class="panel results"><h1 style="color:var(--gold);font-size:clamp(29px,4vw,50px)">Таблица волшебников</h1><table><thead><tr><th>Место</th><th>Имя</th><th>Время</th><th>Ошибки</th></tr></thead><tbody>${records.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${fmt(r.time)}</td><td>${r.errors}</td></tr>`).join('')}</tbody></table><p class="small">Результаты сохраняются в этом браузере на этом устройстве.</p>${btn('Новая игра','title()')}</div></div>`,'img8.png',false)}
window.begin=begin;window.menu=menu;window.enter=enter;window.choose=choose;window.verify=verify;window.closeTask=closeTask;window.finale=finale;window.results=results;window.title=title;title();
</script></body></html>
